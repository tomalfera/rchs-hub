<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseda Charter Hub</title>
<style>
  :root{
    --navy:#000080; --navy-deep:#000066; --sky:#ffffff; --sky-deep:#000080;
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 40px}

  /* Header */
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;
    padding:22px 20px 18px;border-radius:0 0 18px 18px;box-shadow:0 4px 16px rgba(30,58,95,.18)}
  header .crest{display:flex;align-items:center;gap:12px}
  header .crest .badge{width:48px;height:48px;border-radius:14px;background:#fff;
    display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;padding:3px}
  header .crest .badge img{width:100%;height:100%;object-fit:contain}
  header h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
  header .sub{font-size:13px;opacity:.85;margin-top:2px}
  header .today{font-size:12.5px;margin-top:10px;opacity:.9;font-weight:600}
  header .today .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sky);margin-right:6px}

  /* Day strip */
  .days{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;min-width:64px;text-align:center;padding:9px 8px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s}
  .day .dw{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .day .dn{font-size:17px;font-weight:800;margin-top:1px}
  .day.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .day.active .dw{color:#cbd5e1}
  .day.today .dw{color:var(--sky-deep)} .day.today.active .dw{color:var(--sky)}

  /* Filter chips */
  .filters{display:flex;gap:7px;flex-wrap:wrap;padding:8px 0 4px}
  .chip{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);color:var(--muted);transition:.15s}
  .chip.active{color:#fff;border-color:transparent}

  /* Section heading */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 8px}
  .sec-head h2{font-size:15px;font-weight:800}
  .sec-head .count{font-size:12px;color:var(--muted);font-weight:600}

  /* Event cards */
  .evt{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .evt .bar{width:4px;border-radius:4px;flex:none}
  .evt .body{flex:1;min-width:0}
  .evt .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .evt .cat{font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;color:#fff}
  .evt .time{font-size:12px;font-weight:700;color:var(--muted)}
  .evt .title{font-size:15px;font-weight:700;margin-top:4px}
  .evt .loc{font-size:12.5px;color:var(--muted);margin-top:2px}
  .evt .loc::before{content:"📍 "}
  .evt .detail{font-size:12.5px;color:var(--muted);margin-top:3px;font-style:italic}

  .empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:14px}
  .empty .big{font-size:30px;margin-bottom:6px}

  /* Quick links */
  .links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}
  .link{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;cursor:pointer;text-decoration:none;color:var(--ink);transition:.15s}
  .link:hover{border-color:var(--navy)}
  .link .ic{font-size:20px}
  .link .t{font-size:13px;font-weight:700}
  .link .s{font-size:11px;color:var(--muted)}

  footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:26px}
  footer .pill{display:inline-block;background:#eef2f7;border:1px solid var(--line);border-radius:999px;padding:3px 11px}
</style>
</head>

function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(d){ return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}); }

function normTime(t){
  t = String(t==null?'':t).trim();
  if(!t) return {label:'', min:0};
  if(/^lunch$/i.test(t)) return {label:'Lunch', min:720};
  if(/all.?day|tbd|tba/i.test(t)) return {label:t, min:0};
  var m = t.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?$/i);
  if(m){
    var h = parseInt(m[1],10), mm = parseInt(m[2],10);
    var ap = m[3] ? m[3].toLowerCase() : null;
    if(ap==='am' && h===12) h=0;
    if(ap==='pm' && h<12) h+=12;
    if(!ap){ h = (h>=8 && h<=11) ? h : (h<12 ? h+12 : h); }
    var dispH = (h%12) || 12;
    return {label: dispH+':'+String(mm).padStart(2,'0')+' '+(h>=12?'PM':'AM'), min: h*60+mm};
  }
  return {label:t, min:0};
}
function normCat(c){
  c = String(c==null?'':c).trim().toLowerCase();
  if(c.indexOf('lunch')>=0 || c.indexOf('menu')>=0) return 'lunch';
  if(c.startsWith('ath')) return 'athletics';
  if(c.startsWith('art')) return 'arts';
  if(c.indexOf('club')>=0 || c.indexOf('org')>=0) return 'clubs';
  if(c.startsWith('acad')) return 'academic';
  return null;
}
function parseCSV(text){
  var rows=[], row=[], field='', inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c!=='\r') field+=c;
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function colIndex(header, keys){
  for(var i=0;i<header.length;i++){
    var h = String(header[i]==null?'':header[i]).trim().toLowerCase();
    for(var k=0;k<keys.length;k++){ if(h.indexOf(keys[k])===0) return i; }
  }
  return -1;
}
function parseSheetCSV(text){
  var rows = parseCSV(text).filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); });
  if(!rows.length) return [];
  var header = rows[0];
  var ciDate=colIndex(header,['date']), ciCat=colIndex(header,['categor']), ciTime=colIndex(header,['time']);
  var ciTitle=colIndex(header,['title']), ciLoc=colIndex(header,['loc']), ciDet=colIndex(header,['detail']);
  var out=[];
  for(var r=1;r<rows.length;r++){
    var row=rows[r];
    var d=String(row[ciDate]==null?'':row[ciDate]).trim();
    var title=String(row[ciTitle]==null?'':row[ciTitle]).trim();
    if(!d || !title) continue;
    var cat = normCat(row[ciCat]) || 'academic';
    out.push({ date:d, cat:cat, time:normTime(row[ciTime]), title:title, loc:String(row[ciLoc]==null?'':row[ciLoc]).trim(), detail:String(row[ciDet]==null?'':row[ciDet]).trim() });
  }
  return out;
}

function nextWeekday(dow){
  var d=new Date(today);
  while(d.getDay()!==dow) d.setDate(d.getDate()+1);
  return dateKey(d);
}

].map(function(e){ return { date: nextWeekday(e.dow), cat: e.cat, time: normTime(e.t), title: e.title, loc: e.loc, detail: e.detail||'' }; });

function buildDays(){
  var el = document.getElementById("days"); el.innerHTML="";
  for(var i=0;i<7;i++){
    var d=new Date(today); d.setDate(today.getDate()+i);
    var b=document.createElement("div");
    b.className="day"+(i===0?" today":"")+(i===activeIdx?" active":"");
    b.innerHTML='<div class="dw">'+DOW[d.getDay()]+'</div><div class="dn">'+d.getDate()+'</div>';
    b.onclick=(function(idx){ return function(){ activeIdx=idx; render(); }; })(i);
    el.appendChild(b);
  }
}
function buildFilters(){
  var el=document.getElementById("filters"); el.innerHTML="";
  var all=document.createElement("span");
  all.className="chip"+(activeCat==="all"?" active":"");
  if(activeCat==="all") all.style.background="#000080";
  all.textContent="All";
  all.onclick=function(){ activeCat="all"; render(); };
  el.appendChild(all);
  Object.keys(CATS).forEach(function(k){
    var c=CATS[k];
    var s=document.createElement("span");
    s.className="chip"+(activeCat===k?" active":"");
    if(activeCat===k) s.style.background=c.color;
    s.innerHTML=c.icon+" "+c.label;
    s.onclick=(function(kk){ return function(){ activeCat=kk; render(); }; })(k);
    el.appendChild(s);
  });
}
function render(){
  buildDays(); buildFilters();
  var d=new Date(today); d.setDate(today.getDate()+activeIdx);
  var key=dateKey(d), dow=d.getDay(), isToday=activeIdx===0;
  document.getElementById("todayLabel").textContent=fmtDate(new Date());
  document.getElementById("secTitle").textContent=isToday?"Today":(activeIdx===1?"Tomorrow":DOW[dow]+" · "+MONTHS[d.getMonth()]+" "+d.getDate());

  var evs=EVENTS.filter(function(e){ return e.date===key; });
  if(activeCat!=="all") evs=evs.filter(function(e){ return e.cat===activeCat; });

  var list=document.getElementById("list");
  document.getElementById("count").textContent=evs.length?(evs.length+(evs.length===1?" event":" events")):"";

  if(!evs.length){
    var weekend=(dow===0||dow===6);
    list.innerHTML='<div class="empty"><div class="big">'+(weekend?"🌿":"🗓️")+'</div>'+(weekend?"Nothing scheduled — enjoy the weekend.":"No events on this day yet.")+'</div>';
    return;
  }
  evs.sort(function(a,b){ return a.time.min-b.time.min; });
  list.innerHTML=evs.map(function(e){
    var c=CATS[e.cat]||CATS.academic;
    return '<div class="evt"><div class="bar" style="background:'+c.color+'"></div><div class="body">'
      +'<div class="meta"><span class="cat" style="background:'+c.color+'">'+c.icon+' '+c.label+'</span>'
      +'<span class="time">'+e.time.label+'</span></div>'
      +'<div class="title">'+e.title+'</div>'
      +(e.loc?'<div class="loc">'+e.loc+'</div>':'')
      +(e.detail?'<div class="detail">'+e.detail+'</div>':'')
      +'</div></div>';
  }).join("");
}

async function load(){
  var parsed=[];
  if(window.HUB_CSV){ try{ parsed=parseSheetCSV(window.HUB_CSV); }catch(e){} }
  if(!parsed.length){
    try{
      var res=await fetch("/setup-api/kv?key=reseda-charter-hub:events",{cache:"no-store"});
      if(res.ok){
        var j=await res.json();
        if(j && j.value){ parsed=parseSheetCSV(j.value); }
      }
    }catch(e){}
  }
  EVENTS = parsed.length ? parsed : SAMPLE;
  var st=document.getElementById("status");
  if(st) st.textContent = parsed.length ? "Live — updates from the school events sheet" : "Sample data (no live events yet)";
  render();
}
load();

</script>
